<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Time Balloon Adventure</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  overflow:hidden;
  background:linear-gradient(
    #7edcff 0%,
    #c9f5ff 68%,
    #8bd96d 68%,
    #69c55b 100%
  );
}

button,input{
  font-family:inherit;
}

.hidden{
  display:none!important;
}

/* ================= START ================= */

#startScreen{
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.startCard{
  width:min(92%,500px);
  background:#fff;
  border-radius:30px;
  padding:30px 25px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.18);
}

.logo{
  font-size:68px;
  margin-bottom:5px;
}

.startCard h1{
  color:#ff5d7a;
  font-size:36px;
  margin-bottom:8px;
}

.startCard p{
  color:#555;
  font-size:18px;
  margin-bottom:25px;
}

.startCard input{
  width:100%;
  padding:15px;
  border:3px solid #bdefff;
  border-radius:15px;
  font-size:18px;
  text-align:center;
  outline:none;
  margin-bottom:15px;
}

.startBtn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:17px;
  background:linear-gradient(135deg,#ff7187,#ff4e8a);
  color:white;
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 6px #d43f68;
}

.startBtn:active{
  transform:translateY(4px);
  box-shadow:0 2px #d43f68;
}

.teacher{
  margin-top:22px;
  color:#777;
  font-size:14px;
}

/* ================= GAME ================= */

#game{
  width:100%;
  height:100vh;
  position:relative;
  overflow:hidden;
}

.topBar{
  position:absolute;
  z-index:100;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(94%,850px);
  display:flex;
  justify-content:space-between;
}

.info{
  background:white;
  padding:9px 15px;
  border-radius:17px;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
  font-weight:bold;
}

.lives{
  color:#ff4f69;
}

.score{
  color:#477cff;
}

/* ================= PART LABEL ================= */

.partLabel{
  position:absolute;
  top:58px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  background:#fff;
  padding:6px 15px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  color:#6070a5;
}

/* ================= QUESTION ================= */

.questionBox{
  position:absolute;
  top:88px;
  left:50%;
  transform:translateX(-50%);
  width:min(92%,680px);
  background:white;
  border-radius:22px;
  padding:13px 20px;
  text-align:center;
  z-index:100;
  box-shadow:0 7px 20px rgba(0,0,0,.14);
}

.questionSmall{
  color:#777;
  font-size:14px;
  margin-bottom:4px;
}

#question{
  color:#293c75;
  font-size:25px;
  font-weight:bold;
}

/* ================= DIGITAL TIME ================= */

.digitalBox{
  margin-top:8px;
  display:flex;
  justify-content:center;
}

.digitalTime{
  background:#222b3e;
  color:#fff;
  font-family:"Courier New",monospace;
  font-size:40px;
  font-weight:bold;
  letter-spacing:4px;
  padding:6px 18px;
  border-radius:12px;
  box-shadow:
    inset 0 0 10px rgba(255,255,255,.08),
    0 4px 10px rgba(0,0,0,.15);
}

/* ================= CLOUDS ================= */

.cloud{
  position:absolute;
  background:#fff;
  border-radius:100px;
  opacity:.75;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:#fff;
  border-radius:50%;
}

.cloud1{
  width:120px;
  height:34px;
  top:20%;
  left:5%;
}

.cloud1:before{
  width:55px;
  height:55px;
  left:15px;
  bottom:3px;
}

.cloud1:after{
  width:60px;
  height:60px;
  right:15px;
  bottom:0;
}

.cloud2{
  width:150px;
  height:38px;
  top:38%;
  right:4%;
}

.cloud2:before{
  width:65px;
  height:65px;
  left:20px;
  bottom:2px;
}

.cloud2:after{
  width:70px;
  height:70px;
  right:20px;
  bottom:0;
}

/* ================= BALLOONS ================= */

#balloonArea{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.balloon{
  position:absolute;
  width:105px;
  height:125px;
  bottom:-160px;
  border-radius:52% 52% 48% 48%;
  cursor:pointer;
  z-index:20;
  animation:floatUp 25s linear forwards;
  filter:drop-shadow(0 7px 5px rgba(0,0,0,.17));
  transition:transform .2s,opacity .2s;
}

.balloon:before{
  content:"";
  position:absolute;
  width:11px;
  height:11px;
  left:47px;
  bottom:-5px;
  background:inherit;
  transform:rotate(45deg);
}

.balloon:after{
  content:"";
  position:absolute;
  width:2px;
  height:55px;
  background:#777;
  left:52px;
  bottom:-58px;
}

.balloon:nth-child(1){
  left:6%;
  background:#ff6d83;
}

.balloon:nth-child(2){
  left:26%;
  background:#6798ff;
}

.balloon:nth-child(3){
  left:46%;
  background:#ffd34f;
}

.balloon:nth-child(4){
  left:66%;
  background:#62d69b;
}

.balloon:nth-child(5){
  left:86%;
  background:#ad78e7;
}

@keyframes floatUp{
  from{
    bottom:-160px;
  }
  to{
    bottom:calc(100vh + 180px);
  }
}

/* ================= CLOCK ================= */

.clock{
  position:absolute;
  width:79px;
  height:79px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#fff;
  border:4px solid #303b54;
  box-shadow:inset 0 0 0 3px #edf1f7;
}

.clock .number{
  position:absolute;
  font-size:8px;
  font-weight:bold;
  color:#333;
}

.n12{
  top:4px;
  left:50%;
  transform:translateX(-50%);
}

.n3{
  right:5px;
  top:50%;
  transform:translateY(-50%);
}

.n6{
  bottom:4px;
  left:50%;
  transform:translateX(-50%);
}

.n9{
  left:5px;
  top:50%;
  transform:translateY(-50%);
}

.hour,
.minute{
  position:absolute;
  left:50%;
  bottom:50%;
  transform-origin:bottom center;
  border-radius:5px;
}

.hour{
  width:5px;
  height:22px;
  background:#28344b;
}

.minute{
  width:4px;
  height:29px;
  background:#ff526d;
}

.center{
  position:absolute;
  width:9px;
  height:9px;
  background:#28344b;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:5;
}

/* ================= TIME CLASSES ================= */

.t0700 .hour{transform:translateX(-50%) rotate(210deg)}
.t0700 .minute{transform:translateX(-50%) rotate(0deg)}

.t0730 .hour{transform:translateX(-50%) rotate(225deg)}
.t0730 .minute{transform:translateX(-50%) rotate(180deg)}

.t0800 .hour{transform:translateX(-50%) rotate(240deg)}
.t0800 .minute{transform:translateX(-50%) rotate(0deg)}

.t0830 .hour{transform:translateX(-50%) rotate(255deg)}
.t0830 .minute{transform:translateX(-50%) rotate(180deg)}

.t0900 .hour{transform:translateX(-50%) rotate(270deg)}
.t0900 .minute{transform:translateX(-50%) rotate(0deg)}

.t0930 .hour{transform:translateX(-50%) rotate(285deg)}
.t0930 .minute{transform:translateX(-50%) rotate(180deg)}

.t1000 .hour{transform:translateX(-50%) rotate(300deg)}
.t1000 .minute{transform:translateX(-50%) rotate(0deg)}

.t1030 .hour{transform:translateX(-50%) rotate(315deg)}
.t1030 .minute{transform:translateX(-50%) rotate(180deg)}

.t1100 .hour{transform:translateX(-50%) rotate(330deg)}
.t1100 .minute{transform:translateX(-50%) rotate(0deg)}

.t1200 .hour{transform:translateX(-50%) rotate(0deg)}
.t1200 .minute{transform:translateX(-50%) rotate(0deg)}

.t1230 .hour{transform:translateX(-50%) rotate(15deg)}
.t1230 .minute{transform:translateX(-50%) rotate(180deg)}

.t0315 .hour{transform:translateX(-50%) rotate(97.5deg)}
.t0315 .minute{transform:translateX(-50%) rotate(90deg)}

.t0630 .hour{transform:translateX(-50%) rotate(195deg)}
.t0630 .minute{transform:translateX(-50%) rotate(180deg)}

.t0845 .hour{transform:translateX(-50%) rotate(262.5deg)}
.t0845 .minute{transform:translateX(-50%) rotate(270deg)}

.t0510 .hour{transform:translateX(-50%) rotate(155deg)}
.t0510 .minute{transform:translateX(-50%) rotate(60deg)}

.t0640 .hour{transform:translateX(-50%) rotate(200deg)}
.t0640 .minute{transform:translateX(-50%) rotate(240deg)}

.t0815 .hour{transform:translateX(-50%) rotate(127.5deg)}
.t0815 .minute{transform:translateX(-50%) rotate(90deg)}

.t0230 .hour{transform:translateX(-50%) rotate(75deg)}
.t0230 .minute{transform:translateX(-50%) rotate(180deg)}

.t1135 .hour{transform:translateX(-50%) rotate(347.5deg)}
.t1135 .minute{transform:translateX(-50%) rotate(210deg)}

.t0405 .hour{transform:translateX(-50%) rotate(122.5deg)}
.t0405 .minute{transform:translateX(-50%) rotate(30deg)}

.t0445 .hour{transform:translateX(-50%) rotate(142.5deg)}
.t0445 .minute{transform:translateX(-50%) rotate(270deg)}

.t0920 .hour{transform:translateX(-50%) rotate(280deg)}
.t0920 .minute{transform:translateX(-50%) rotate(120deg)}

.t1050 .hour{transform:translateX(-50%) rotate(325deg)}
.t1050 .minute{transform:translateX(-50%) rotate(300deg)}

/* ================= DIGITAL BALLOON ================= */

.digitalBalloonTime{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:#fff;
  color:#263550;
  border-radius:12px;
  padding:7px 8px;
  font-family:"Courier New",monospace;
  font-size:18px;
  font-weight:bold;
  white-space:nowrap;
  box-shadow:0 3px 7px rgba(0,0,0,.18);
}

/* ================= CHARACTER ================= */

.character{
  position:absolute;
  right:14px;
  bottom:5px;
  width:125px;
  height:150px;
  z-index:80;
  animation:bob 2.5s ease-in-out infinite;
}

.character svg{
  width:100%;
  height:100%;
}

@keyframes bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}

.speech{
  position:absolute;
  right:135px;
  bottom:110px;
  background:white;
  color:#40538d;
  font-size:13px;
  font-weight:bold;
  padding:8px 12px;
  border-radius:14px;
  z-index:90;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}

/* ================= MESSAGE ================= */

.message{
  position:absolute;
  z-index:300;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:#fff;
  width:min(90%,400px);
  padding:30px;
  border-radius:27px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.message h2{
  color:#ff5e7d;
  font-size:34px;
  margin-bottom:10px;
}

.message p{
  color:#555;
  line-height:1.6;
  margin-bottom:18px;
}

.message button{
  border:0;
  background:#ff6682;
  color:white;
  font-size:17px;
  font-weight:bold;
  padding:12px 25px;
  border-radius:14px;
  cursor:pointer;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .startCard h1{
    font-size:29px;
  }

  .logo{
    font-size:55px;
  }

  .topBar{
    top:7px;
  }

  .info{
    font-size:13px;
    padding:7px 10px;
  }

  .partLabel{
    top:52px;
  }

  .questionBox{
    top:78px;
    padding:10px 12px;
  }

  #question{
    font-size:18px;
  }

  .digitalTime{
    font-size:31px;
    padding:5px 14px;
  }

  .balloon{
    width:88px;
    height:108px;
  }

  .balloon:before{
    left:39px;
  }

  .balloon:after{
    left:44px;
  }

  .clock{
    width:66px;
    height:66px;
  }

  .character{
    width:88px;
    height:108px;
    right:2px;
  }

  .speech{
    right:72px;
    bottom:78px;
    font-size:10px;
  }
}

@media(max-width:420px){

  .balloon{
    width:76px;
    height:96px;
  }

  .balloon:nth-child(1){left:2%}
  .balloon:nth-child(2){left:22%}
  .balloon:nth-child(3){left:42%}
  .balloon:nth-child(4){left:62%}
  .balloon:nth-child(5){left:82%}

  .clock{
    width:58px;
    height:58px;
  }

  .digitalBalloonTime{
    font-size:15px;
  }
}
</style>
</head>

<body>

<!-- ================= START ================= -->

<div id="startScreen">

  <div class="startCard">

    <div class="logo">🎈⏰</div>

    <h1>Time Balloon Adventure</h1>

    <p>Pop the correct balloon and tell the time!</p>

    <input
      id="playerName"

      placeholder="Enter your name"

<script>

/* =====================================================
   GAME DATA
===================================================== */

/*
 PART 1:
 The child reads the written English expression
 and chooses the matching analog clock.

 PART 2:
 The child reads the digital time
 and chooses the matching analog clock.
*/

const part1Questions = [

  {
    text:"Find: quarter past three",
    time:"03:15",
    className:"t0315"
  },

  {
    text:"Find: half past six",
    time:"06:30",
    className:"t0630"
  },

  {
    text:"Find: quarter to nine",
    time:"08:45",
    className:"t0845"
  },

  {
    text:"Find: ten past five",
    time:"05:10",
    className:"t0510"
  },

  {
    text:"Find: twenty to seven",
    time:"06:40",
    className:"t0640"
  },

  {
    text:"Find: quarter past eight",
    time:"08:15",
    className:"t0815"
  },

  {
    text:"Find: half past two",
    time:"02:30",
    className:"t0230"
  },

  {
    text:"Find: twenty-five to twelve",
    time:"11:35",
    className:"t1135"
  },

  {
    text:"Find: five past four",
    time:"04:05",
    className:"t0405"
  },

  {
    text:"Find: quarter to five",
    time:"04:45",
    className:"t0445"
  },

  {
    text:"Find: twenty past nine",
    time:"09:20",
    className:"t0920"
  },

  {
    text:"Find: ten to eleven",
    time:"10:50",
    className:"t1050"
  }

];


const part2Questions = [

  {
    text:"What time is it?",
    time:"07:00",
    className:"t0700"
  },

  {
    text:"What time is it?",
    time:"07:30",
    className:"t0730"
  },

  {
    text:"What time is it?",
    time:"08:00",
    className:"t0800"
  },

  {
    text:"What time is it?",
    time:"08:30",
    className:"t0830"
  },

  {
    text:"What time is it?",
    time:"09:00",
    className:"t0900"
  },

  {
    text:"What time is it?",
    time:"09:30",
    className:"t0930"
  },

  {
    text:"What time is it?",
    time:"10:00",
    className:"t1000"
  },

  {
    text:"What time is it?",
    time:"10:30",
    className:"t1030"
  },

  {
    text:"What time is it?",
    time:"11:00",
    className:"t1100"
  },

  {
    text:"What time is it?",
    time:"12:00",
    className:"t1200"
  },

  {
    text:"What time is it?",
    time:"12:30",
    className:"t1230"
  }

];


/* =====================================================
   VARIABLES
===================================================== */

let playerName = "";

let lives = 5;
let score = 0;

let part = 1;
let questionIndex = 0;

let currentQuestions = [];

let finishedBalloons = 0;

let gameEnded = false;

let audioContext = null;

let musicInterval = null;


/* =====================================================
   START GAME
===================================================== */

function startGame(){

  playerName =
    document.getElementById("playerName").value.trim();

  if(!playerName){
    playerName = "Player";
  }

  document
    .getElementById("startScreen")
    .classList.add("hidden");

  document
    .getElementById("game")
    .classList.remove("hidden");

  lives = 5;
  score = 0;

  part = 1;

  gameEnded = false;

  currentQuestions =
    shuffle([...part1Questions]);

  questionIndex = 0;

  updateUI();

  startAudio();

  showQuestion();

}


/* =====================================================
   UI
===================================================== */

function updateUI(){

  document.getElementById("lives").textContent =
    lives;

  document.getElementById("score").textContent =
    score;

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion(){

  if(gameEnded) return;

  /*
    If current part is finished,
    move to the next part.
  */

  if(questionIndex >= currentQuestions.length){

    if(part === 1){

      part = 2;

      currentQuestions =
        shuffle([...part2Questions]);

      questionIndex = 0;

      showPart2Message();

      return;

    }else{

      winGame();

      return;

    }

  }


  finishedBalloons = 0;

  const q = currentQuestions[questionIndex];

  const question =
    document.getElementById("question");

  const questionSmall =
    document.getElementById("questionSmall");

  const digitalContainer =
    document.getElementById("digitalContainer");

  const digitalTime =
    document.getElementById("digitalTime");

  const partLabel =
    document.getElementById("partLabel");


  if(part === 1){

    partLabel.textContent =
      "PART 1 • READ THE TIME";

    questionSmall.textContent =
      "Find the correct clock:";

    question.textContent =
      q.text;

    digitalContainer.classList.add("hidden");

  }else{

    partLabel.textContent =
      "PART 2 • DIGITAL TO ANALOG";

    questionSmall.textContent =
      "Find the matching analog clock:";

    question.textContent =
      q.text;

    digitalContainer.classList.remove("hidden");

    digitalTime.textContent =
      formatDigitalTime(q.time);

  }


  createBalloons(q);

}


/* =====================================================
   PART 2 INTRO
===================================================== */

function showPart2Message(){

  const question =
    document.getElementById("question");

  const questionSmall =
    document.getElementById("questionSmall");

  const digitalContainer =
    document.getElementById("digitalContainer");

  const digitalTime =
    document.getElementById("digitalTime");


  questionSmall.textContent =
    "Great! Now try this:";

  question.textContent =
    "Read the digital time and find the clock!";

  digitalContainer.classList.remove("hidden");

  digitalTime.textContent =
    "8:30";


  setTimeout(()=>{

    if(!gameEnded){

      showQuestion();

    }

  },1500);

}


/* =====================================================
   CREATE BALLOONS
===================================================== */

function createBalloons(q){

  const area =
    document.getElementById("balloonArea");

  area.innerHTML = "";

  /*
    Correct answer + four wrong answers.
  */

  let choices = [q.className];

  const wrongChoices =
    currentQuestions
      .map(item => item.className)
      .filter(item => item !== q.className);

  /*
    Add more possible times from both parts
    if necessary.
  */

  const allWrong =
    shuffle([
      ...wrongChoices,
      ...part1Questions.map(x=>x.className),
      ...part2Questions.map(x=>x.className)
    ])
    .filter(x => x !== q.className);


  for(const item of allWrong){

    if(choices.length >= 5) break;

    if(!choices.includes(item)){
      choices.push(item);
    }

  }


  choices =
    shuffle(choices);


  choices.forEach((clockClass,index)=>{

    const balloon =
      document.createElement("div");

    balloon.className =
      "balloon";

    /*
      Slightly staggered start.
    */

    balloon.style.animationDelay =
      `${index * 0.8}s`;


    const clock =
      document.createElement("div");

    clock.className =
      `clock ${clockClass}`;


    /*
      Clock numbers.
    */

    clock.innerHTML = `
      <span class="number n12">12</span>
      <span class="number n3">3</span>
      <span class="number n6">6</span>
      <span class="number n9">9</span>
      <div class="hour"></div>
      <div class="minute"></div>
      <div class="center"></div>
    `;


    /*
      Part 1:
      analog clock.

      Part 2:
      still analog clock,
      because the child must match
      digital → analog.
    */

    balloon.appendChild(clock);


    /*
      Is this the correct answer?
    */

    balloon.dataset.answer =
      clockClass === q.className
      ? "correct"
      : "wrong";


    balloon.addEventListener(
      "click",
      () => balloonClicked(balloon)
    );


    balloon.addEventListener(
      "animationend",
      balloonFinished
    );


    area.appendChild(balloon);

  }

}


/* =====================================================
   BALLOON FINISHED
===================================================== */

function balloonFinished(){

  if(this.dataset.done === "true")
    return;

  this.dataset.done = "true";

  finishedBalloons++;


  /*
    If all balloons reached the top
    and the child did not find the answer:
    lose ONE life.
  */

  if(finishedBalloons >= 5){

    if(gameEnded) return;

    lives--;

    wrongSound();

    updateUI();


    if(lives <= 0){

      loseGame();

      return;

    }


    /*
      Next question after losing one life.
    */

    setTimeout(()=>{

      if(!gameEnded){

        questionIndex++;

        showQuestion();

      }

    },500);

  }

}


/* =====================================================
   BALLOON CLICK
===================================================== */

function balloonClicked(balloon){

  if(gameEnded) return;

  if(balloon.dataset.clicked === "true")
    return;

  balloon.dataset.clicked = "true";


  if(balloon.dataset.answer === "correct"){

    correctSound();

    score += 10;

    updateUI();


    balloon.style.transform =
      "scale(1.35)";

    balloon.style.opacity =
      "0";


    setTimeout(()=>{

      questionIndex++;

      showQuestion();

    },450);


  }else{

    /*
      Wrong balloon:
      lose ONE life.
    */

    wrongSound();

    lives--;

    updateUI();


    balloon.style.transform =
      "scale(.7)";

    balloon.style.opacity =
      "0";


    setTimeout(()=>{

      balloon.remove();

    },180);


    if(lives <= 0){

      loseGame();

    }

  }

}


/* =====================================================
   WIN
===================================================== */

function winGame(){

  gameEnded = true;

  clearInterval(musicInterval);

  winSound();


  document
    .getElementById("messageTitle")
    .textContent =
      "🎉 Excellent, " + playerName + "!";


  document
    .getElementById("messageText")
    .innerHTML =
      `
      You completed both parts!<br><br>
      ⭐ Score: ${score}<br>
      ❤️ Lives left: ${lives}<br><br>
      Great job telling the time!
      `;


  document
    .getElementById("message")
    .classList.remove("hidden");

}


/* =====================================================
   GAME OVER
===================================================== */

function loseGame(){

  gameEnded = true;

  clearInterval(musicInterval);

  loseSound();


  document
    .getElementById("messageTitle")
    .textContent =
      "💔 GAME OVER";


  document
    .getElementById("messageText")
    .innerHTML =
      `
      Good try, ${playerName}!<br><br>
      ⭐ Score: ${score}<br><br>
      Keep practicing!
      `;


  document
    .getElementById("message")
    .classList.remove("hidden");

}


/* =====================================================
   RESTART
===================================================== */

function restartGame(){

  document
    .getElementById("message")
    .classList.add("hidden");

  lives = 5;

  score = 0;

  part = 1;

  questionIndex = 0;

  gameEnded = false;

  currentQuestions =
    shuffle([...part1Questions]);

  updateUI();

  showQuestion();

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatDigitalTime(time){

  let parts = time.split(":");

  let hour =
    parseInt(parts[0]);

  let minute =
    parts[1];

  return `${hour}:${minute}`;

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

  for(let i=array.length-1;i>0;i--){

    const j =
      Math.floor(Math.random()*(i+1));

    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }

  return array;

}


/* =====================================================
   AUDIO
===================================================== */

function startAudio(){

  try{

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    if(audioContext.state === "suspended"){
      audioContext.resume();
    }

    startFunMusic();

  }catch(e){}

}


function tone(
  frequency,
  duration,
  type="sine",
  volume=.06
){

  if(!audioContext) return;

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();


  oscillator.type = type;

  oscillator.frequency.value =
    frequency;


  gain.gain.setValueAtTime(
    volume,
    audioContext.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime + duration
  );


  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );


  oscillator.start();

  oscillator.stop(
    audioContext.currentTime + duration
  );

}


/* =====================================================
   HAPPY GAME MUSIC
