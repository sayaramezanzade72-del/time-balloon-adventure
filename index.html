<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Time Balloon Pop</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Trebuchet MS",Arial,sans-serif;
    overflow:hidden;
    min-height:100vh;
    background:
        linear-gradient(#71d7ff 0%,#bceeff 55%,#dff9ff 100%);
}

/* =========================
   CLOUDS
========================= */

.cloud{
    position:absolute;
    background:white;
    border-radius:100px;
    opacity:.8;
    filter:blur(.3px);
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud:before{
    width:55px;
    height:55px;
    left:25px;
    bottom:0;
}

.cloud:after{
    width:75px;
    height:75px;
    right:25px;
    bottom:0;
}

.cloud1{
    width:170px;
    height:45px;
    top:100px;
    left:4%;
}

.cloud2{
    width:190px;
    height:50px;
    top:190px;
    right:2%;
}

.cloud3{
    width:130px;
    height:38px;
    top:350px;
    left:15%;
}

/* =========================
   START SCREEN
========================= */

.screen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.startCard,
.endCard{
    width:min(440px,94%);
    background:rgba(255,255,255,.96);
    border:5px solid white;
    border-radius:35px;
    padding:30px 25px;
    text-align:center;
    box-shadow:
        0 15px 40px rgba(0,80,130,.2);
    position:relative;
    z-index:20;
}

.logo{
    font-size:70px;
    line-height:1;
    margin-bottom:10px;
}

h1{
    font-size:36px;
    color:#ff4f87;
    text-shadow:2px 3px 0 #ffd2df;
    margin-bottom:8px;
}

.subtitle{
    color:#467080;
    font-size:17px;
    margin-bottom:25px;
}

input{
    width:100%;
    border:3px solid #70d5f8;
    border-radius:18px;
    padding:15px;
    font-size:18px;
    text-align:center;
    outline:none;
    margin-bottom:15px;
}

input:focus{
    border-color:#ff77a5;
}

.mainButton{
    border:0;
    background:linear-gradient(#ff76a5,#ff3d78);
    color:white;
    font-size:19px;
    font-weight:bold;
    padding:15px 35px;
    border-radius:18px;
    cursor:pointer;
    box-shadow:0 6px 0 #d92f61;
}

.mainButton:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #d92f61;
}

.teacher{
    margin-top:22px;
    color:#71858c;
    font-size:14px;
}

/* =========================
   GAME
========================= */

#game{
    display:none;
    position:fixed;
    inset:0;
    overflow:hidden;
}

#sky{
    position:absolute;
    inset:0;
    overflow:hidden;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    width:min(700px,94%);
    display:flex;
    justify-content:space-between;
    z-index:50;
}

.info{
    background:white;
    border-radius:20px;
    padding:9px 15px;
    font-weight:bold;
    color:#45606b;
    box-shadow:0 5px 15px rgba(0,80,120,.15);
}

/* =========================
   QUESTION
========================= */

.questionBox{
    position:absolute;
    top:65px;
    left:50%;
    transform:translateX(-50%);
    width:min(650px,92%);
    background:rgba(255,255,255,.97);
    border:4px solid white;
    border-radius:25px;
    padding:13px 15px;
    text-align:center;
    z-index:40;
    box-shadow:0 7px 20px rgba(0,70,110,.15);
}

.questionType{
    color:#78919a;
    font-size:14px;
    font-weight:bold;
}

.question{
    margin-top:4px;
    font-size:25px;
    color:#334d57;
    font-weight:bold;
}

/* =========================
   CARTOON CHARACTER
========================= */

.character{
    position:absolute;
    bottom:8px;
    right:18px;
    width:125px;
    height:170px;
    z-index:25;
    animation:characterFloat 2.5s ease-in-out infinite;
}

/* hair */

.hair{
    position:absolute;
    width:78px;
    height:68px;
    background:#5b3826;
    border-radius:50% 50% 42% 45%;
    top:5px;
    left:25px;
    z-index:3;
}

/* face */

.face{
    position:absolute;
    width:70px;
    height:75px;
    background:#ffd0a8;
    border-radius:48% 48% 45% 45%;
    top:27px;
    left:29px;
    z-index:4;
}

.eye{
    position:absolute;
    width:8px;
    height:11px;
    background:#333;
    border-radius:50%;
    top:29px;
}

.eye.left{
    left:18px;
}

.eye.right{
    right:18px;
}

.mouth{
    position:absolute;
    width:25px;
    height:13px;
    border-bottom:4px solid #e05268;
    border-radius:50%;
    bottom:17px;
    left:23px;
}

/* body */

.body{
    position:absolute;
    width:85px;
    height:80px;
    background:#ffd34e;
    border-radius:30px 30px 15px 15px;
    left:20px;
    top:88px;
}

.arm{
    position:absolute;
    width:22px;
    height:65px;
    background:#ffd0a8;
    border-radius:20px;
    top:95px;
}

.arm.left{
    left:5px;
    transform:rotate(25deg);
}

.arm.right{
    right:5px;
    transform:rotate(-30deg);
}

.leg{
    position:absolute;
    width:25px;
    height:45px;
    background:#3479bd;
    border-radius:15px;
    bottom:0;
}

.leg.left{
    left:37px;
}

.leg.right{
    left:68px;
}

.characterClock{
    position:absolute;
    width:45px;
    height:45px;
    border:3px solid #333;
    border-radius:50%;
    background:white;
    right:-3px;
    top:91px;
    z-index:10;
}

.characterClock:before{
    content:"";
    position:absolute;
    width:3px;
    height:15px;
    background:#333;
    left:19px;
    top:7px;
    transform:rotate(30deg);
    transform-origin:bottom;
}

.characterClock:after{
    content:"";
    position:absolute;
    width:3px;
    height:12px;
    background:#ff4c7d;
    left:20px;
    top:10px;
    transform:rotate(110deg);
    transform-origin:bottom;
}

@keyframes characterFloat{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

/* =========================
   BALLOONS
========================= */

.balloon{
    position:absolute;
    width:120px;
    height:155px;
    cursor:pointer;
    user-select:none;
    z-index:20;
    transition:transform .15s;
    touch-action:manipulation;
}

.balloon:hover{
    transform:scale(1.06);
}

.balloonBody{
    position:absolute;
    width:110px;
    height:120px;
    left:5px;
    top:0;
    border-radius:55% 55% 50% 50%;
    box-shadow:
        inset -12px -10px 18px rgba(0,0,0,.12),
        inset 10px 10px 18px rgba(255,255,255,.35),
        0 8px 14px rgba(0,80,120,.18);
}

.balloonBody:after{
    content:"";
    position:absolute;
    bottom:-9px;
    left:50%;
    transform:translateX(-50%);
    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-top:12px solid currentColor;
}

.color1 .balloonBody{
    background:linear-gradient(135deg,#ff8db2,#ff3c76);
    color:#e53268;
}

.color2 .balloonBody{
    background:linear-gradient(135deg,#72e3ff,#25a7e0);
    color:#168fc4;
}

.color3 .balloonBody{
    background:linear-gradient(135deg,#c4f276,#58c54d);
    color:#42a33b;
}

.color4 .balloonBody{
    background:linear-gradient(135deg,#d6a0ff,#8c54dd);
    color:#7542bf;
}

.color5 .balloonBody{
    background:linear-gradient(135deg,#ffe47a,#ffad28);
    color:#e89612;
}

.string{
    position:absolute;
    width:2px;
    height:38px;
    background:#777;
    top:120px;
    left:60px;
}

/* =========================
   CLOCK
========================= */

.clock{
    position:absolute;
    width:78px;
    height:78px;
    left:16px;
    top:20px;
    border:4px solid #29363c;
    border-radius:50%;
    background:white;
    box-shadow:0 3px 6px rgba(0,0,0,.2);
}

.number{
    position:absolute;
    font-size:9px;
    font-weight:bold;
    color:#333;
}

.n12{
    top:2px;
    left:50%;
    transform:translateX(-50%);
}

.n3{
    right:4px;
    top:50%;
    transform:translateY(-50%);
}

.n6{
    bottom:2px;
    left:50%;
    transform:translateX(-50%);
}

.n9{
    left:4px;
    top:50%;
    transform:translateY(-50%);
}

.hand{
    position:absolute;
    left:50%;
    bottom:50%;
    transform-origin:bottom center;
    border-radius:5px;
}

.hour{
    width:5px;
    height:22px;
    background:#333;
}

.minute{
    width:3px;
    height:29px;
    background:#ff4b7c;
}

.center{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#333;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

/* =========================
   POP
========================= */

.pop{
    animation:pop .25s forwards !important;
}

@keyframes pop{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.3);
    }
    100%{
        transform:scale(0);
        opacity:0;
    }
}

/* =========================
   END
========================= */

#endScreen{
    display:none;
}

.endTitle{
    font-size:38px;
    color:#ff4f87;
    margin-bottom:15px;
}

.finalName{
    font-size:22px;
    color:#405762;
    margin-bottom:10px;
}

.finalScore{
    font-size:28px;
    color:#199fd4;
    font-weight:bold;
    margin-bottom:25px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .info{
        font-size:13px;
        padding:8px 11px;
    }

    .questionBox{
        top:62px;
    }

    .question{
        font-size:20px;
    }

    .character{
        transform:scale(.75);
        transform-origin:bottom right;
        right:0;
        bottom:0;
    }

    .balloon{
        transform:scale(.82);
    }

    .balloon:hover{
        transform:scale(.88);
    }

    .cloud3{
        display:none;
    }
}
</style>
</head>

<body>

<!-- CLOUDS -->

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>


<!-- =========================
     START SCREEN
========================= -->

<div id="startScreen" class="screen">

    <div class="startCard">

        <div class="logo">🎈⏰</div>

        <h1>Time Balloon Pop</h1>

        <div class="subtitle">
            Learn to tell the time!
        </div>

        <input
            id="playerName"
            type="text"
            placeholder="Enter your name"
            maxlength="20"
        >

        <br>

        <button class="mainButton" onclick="startGame()">
            START GAME
        </button>

        <div class="teacher">
            Teacher: Ms. Ramezanzadeh
        </div>

    </div>

</div>


<!-- =========================
     GAME
========================= -->

<div id="game">

    <div class="topbar">

        <div class="info">
            ❤️ <span id="lives">5</span>
        </div>

        <div class="info">
            ⭐ <span id="score">0</span>
        </div>

        <div class="info">
            🎈 Time
        </div>

    </div>


    <div class="questionBox">

        <div id="questionType" class="questionType">
            Find the correct time
        </div>

        <div id="question" class="question">
            quarter past three
        </div>

    </div>


    <div id="sky"></div>


    <!-- CARTOON CHARACTER -->

    <div class="character">

        <div class="hair"></div>

        <div class="face">

            <div class="eye left"></div>
            <div class="eye right"></div>

            <div class="mouth"></div>

        </div>

        <div class="body"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="characterClock"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>

    </div>

</div>


<!-- =========================
     END SCREEN
========================= -->

<div id="endScreen" class="screen">

    <div class="endCard">

        <div id="endEmoji" class="logo">
            🏆
        </div>

        <div id="endTitle" class="endTitle">
            TIME CHAMPION!
        </div>

        <div class="finalName">
            Well done, <strong id="finalName"></strong>!
        </div>

        <div class="finalScore">
            ⭐ Score:
            <span id="finalScore">0</span>
        </div>

        <button class="mainButton" onclick="location.reload()">
            PLAY AGAIN
        </button>

        <div class="teacher">
            Ms. Ramezanzadeh
        </div>

    </div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let playerName="";
let score=0;
let lives=5;

let currentQuestion;

let balloons=[];

let audioCtx;
let musicInterval;


/* =========================
   QUESTIONS
========================= */

const questions=[

    {
        type:"Find the correct time",
        text:"quarter past three",
        hour:3,
        minute:15
    },

    {
        type:"Find the correct time",
        text:"half past six",
        hour:6,
        minute:30
    },

    {
        type:"Find the correct time",
        text:"quarter to nine",
        hour:8,
        minute:45
    },

    {
        type:"Find the correct time",
        text:"ten past five",
        hour:5,
        minute:10
    },

    {
        type:"Find the correct time",
        text:"twenty to seven",
        hour:6,
        minute:40
    },

    {
        type:"Find the correct time",
        text:"quarter past eight",
        hour:8,
        minute:15
    },

    {
        type:"Find the correct time",
        text:"half past two",
        hour:2,
        minute:30
    },

    {
        type:"Find the correct time",
        text:"twenty-five to twelve",
        hour:11,
        minute:35
    },

    {
        type:"Find the correct time",
        text:"five past four",
        hour:4,
        minute:5
    },

    {
        type:"Find the correct time",
        text:"quarter to five",
        hour:4,
        minute:45
    },

    {
        type:"Find the correct time",
        text:"twenty past nine",
        hour:9,
        minute:20
    },

    {
        type:"Find the correct time",
        text:"ten to eleven",
        hour:10,
        minute:50
    },

    /* Daily routines */

    {
        type:"What time do you have breakfast?",
        text:"7:00",
        hour:7,
        minute:0
    },

    {
        type:"What time do you go to school?",
        text:"8:00",
        hour:8,
        minute:0
    },

    {
        type:"What time do you have lunch?",
        text:"12:30",
        hour:12,
        minute:30
    },

    {
        type:"What time do you go to bed?",
        text:"10:00",
        hour:10,
        minute:0
    }

];


/* =========================
   START
========================= */

function startGame(){

    playerName=
        document.getElementById("playerName")
        .value.trim();

    if(playerName===""){
        playerName="Player";
    }

    document.getElementById("startScreen")
        .style.display="none";

    document.getElementById("game")
        .style.display="block";

    initAudio();

    nextQuestion();
}


/* =========================
   AUDIO
========================= */

function initAudio(){

    try{

        audioCtx=
            new(window.AudioContext ||
            window.webkitAudioContext)();

        musicInterval=setInterval(()=>{

            playTone(
                250+Math.random()*100,
                .07,
                "triangle",
                .025
            );

        },800);

    }catch(e){}

}


function playTone(
    frequency,
    duration,
    type="sine",
    volume=.08
){

    if(!audioCtx)return;

    const oscillator=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    oscillator.type=type;
    oscillator.frequency.value=frequency;

    gain.gain.value=volume;

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start();

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duration
    );

    oscillator.stop(
        audioCtx.currentTime+duration
    );
}


function correctSound(){

    playTone(700,.12);

    setTimeout(()=>{
        playTone(1000,.18);
    },120);

}


function wrongSound(){

    playTone(180,.3,"sawtooth",.1);

}


function winSound(){

    playTone(523,.15);
    setTimeout(()=>playTone(659,.15),150);
    setTimeout(()=>playTone(784,.25),300);

}


function loseSound(){

    playTone(300,.2);
    setTimeout(()=>{
        playTone(180,.35);
    },220);

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){

    clearBalloons();

    currentQuestion=
        questions[
            Math.floor(
                Math.random()*questions.length
            )
        ];

    document.getElementById("questionType")
        .textContent=
        currentQuestion.type;

    document.getElementById("question")
        .textContent=
        currentQuestion.text;

    createBalloons();

}


/* =========================
   CREATE BALLOONS
========================= */

function createBalloons(){

    const correctIndex=
        Math.floor(Math.random()*6);

    for(let i=0;i<6;i++){

        let hour;
        let minute;

        if(i===correctIndex){

            hour=currentQuestion.hour;
            minute=currentQuestion.minute;

        }else{

            const fake=generateFakeTime();

            hour=fake.hour;
            minute=fake.minute;

        }

        createBalloon(
            hour,
            minute,
            i
        );

    }

}


/* =========================
   FAKE TIME
========================= */

function generateFakeTime(){

    let h,m;

    do{

        h=Math.floor(Math.random()*12)+1;

        m=Math.floor(Math.random()*12)*5;

    }while(
        h===currentQuestion.hour &&
        m===currentQuestion.minute
    );

    return{
        hour:h,
        minute:m
    };

}


/* =========================
   CLOCK
========================= */

function createClock(hour,minute){

    const clock=
        document.createElement("div");

    clock.className="clock";

    clock.innerHTML=`

        <div class="number n12">12</div>
        <div class="number n3">3</div>
        <div class="number n6">6</div>
        <div class="number n9">9</div>

        <div class="hand hour"></div>
        <div class="hand minute"></div>

        <div class="center"></div>
    `;

    const hourHand=
        clock.querySelector(".hour");

    const minuteHand=
        clock.querySelector(".minute");

    const hourAngle=
        (hour%12)*30+
        minute*.5;

    const minuteAngle=
        minute*6;

    hourHand.style.transform=
        `translateX(-50%) rotate(${hourAngle}deg)`;

    minuteHand.style.transform=
        `translateX(-50%) rotate(${minuteAngle}deg)`;

    return clock;

}


/* =========================
   CREATE BALLOON
========================= */

function createBalloon(
    hour,
    minute,
    index
){

    const balloon=
        document.createElement("div");

    balloon.className=
        "balloon color"+
        ((index%5)+1);

    balloon.dataset.hour=hour;
    balloon.dataset.minute=minute;

    balloon.innerHTML=`
        <div class="balloonBody"></div>
        <div class="string"></div>
    `;

    balloon
        .querySelector(".balloonBody")
        .appendChild(
            createClock(hour,minute)
        );

    const maxX=
        Math.max(
            5,
            window.innerWidth-130
        );

    balloon.style.left=
        (Math.random()*maxX)+"px";


    /*
       IMPORTANT:
       No timer.

       Balloons move slowly.
       When ALL balloons reach the top,
       the next question appears.
    */

    const duration=
        20+Math.random()*5;

    const startBottom=
        -190-
        Math.random()*300;

    balloon.style.bottom=
        startBottom+"px";

    document.getElementById("sky")
        .appendChild(balloon);

    balloons.push(balloon);

    /* start movement */

    requestAnimationFrame(()=>{

        balloon.style.transition=
            `bottom ${duration}s linear`;

        balloon.style.bottom=
            (window.innerHeight+190)+"px";

    });


    /*
       Mark balloon as finished
       when it reaches the top.
    */

    setTimeout(()=>{

        if(
            balloon.parentNode &&
            !balloon.classList.contains("pop")
        ){

            balloon.dataset.finished="true";

            checkAllFinished();

        }

    },duration*1000+200);


    balloon.addEventListener(
        "click",
        ()=>{
            checkBalloon(balloon);
        }
    );

    balloon.addEventListener(
        "touchstart",
        e=>{
            e.preventDefault();
            checkBalloon(balloon);
        },
        {passive:false}
    );

}


/* =========================
   CHECK ALL BALLOONS
========================= */

function checkAllFinished(){

    const allFinished=
        balloons.length===6 &&
        balloons.every(
            b=>b.dataset.finished==="true"
        );

    if(allFinished){

        setTimeout(()=>{

            nextQuestion();

        },500);

    }

}


/* =========================
   CHECK ANSWER
========================= */

function checkBalloon(balloon){

    if(
        balloon.classList.contains("pop")
    )return;

    const hour=
        Number(balloon.dataset.hour);

    const minute=
        Number(balloon.dataset.minute);


    if(
        hour===currentQuestion.hour &&
        minute===currentQuestion.minute
    ){

        /* CORRECT */

        score+=10;

        document.getElementById("score")
            .textContent=score;

        balloon.classList.add("pop");

        correctSound();

        setTimeout(()=>{

            if(score>=100){

                winGame();

            }else{

                nextQuestion();

            }

        },350);

    }else{

        /* WRONG */

        lives--;

        document.getElementById("lives")
            .textContent=lives;

        balloon.classList.add("pop");

        wrongSound();

        if(lives<=0){

            setTimeout(()=>{
                gameOver();
            },300);

        }

    }

}


/* =========================
   CLEAR BALLOONS
========================= */

function clearBalloons(){

    balloons.forEach(
        balloon=>{
            if(balloon.parentNode){
                balloon.remove();
            }
        }
    );

    balloons=[];

}


/* =========================
   WIN
========================= */

function winGame(){

    clearInterval(musicInterval);

    clearBalloons();

    winSound();

    document.getElementById("game")
        .style.display="none";

    document.getElementById("endScreen")
        .style.display="flex";

    document.getElementById("endEmoji")
        .textContent="🏆";

    document.getElementById("endTitle")
        .textContent="TIME CHAMPION!";

    document.getElementById("finalName")
        .textContent=playerName;

    document.getElementById("finalScore")
        .textContent=score;

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    clearInterval(musicInterval);

    clearBalloons();

    loseSound();

    document.getElementById("game")
        .style.display="none";

    document.getElementById("endScreen")
        .style.display="flex";

    document.getElementById("endEmoji")
        .textContent="😢";

    document.getElementById("endTitle")
        .textContent="GAME OVER";

    document.getElementById("finalName")
        .textContent=playerName;

    document.getElementById("finalScore")
        .textContent=score;

}

</script>
