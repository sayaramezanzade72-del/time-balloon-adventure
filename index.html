<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Balloon Pop</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    overflow:hidden;
    background:linear-gradient(#7ddcff,#dff8ff);
}

/* ---------- START SCREEN ---------- */

.screen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.start-card,
.end-card{
    width:min(430px,95%);
    background:rgba(255,255,255,.95);
    border-radius:30px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.logo{
    font-size:65px;
    margin-bottom:10px;
}

h1{
    color:#ff5c8a;
    font-size:34px;
    margin-bottom:10px;
}

.subtitle{
    color:#555;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:15px;
    border:3px solid #8edcff;
    border-radius:15px;
    font-size:18px;
    text-align:center;
    outline:none;
    margin-bottom:15px;
}

button{
    border:none;
    background:#ff5c8a;
    color:white;
    padding:15px 30px;
    border-radius:18px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 6px 0 #d83e6b;
}

button:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #d83e6b;
}

.teacher{
    margin-top:25px;
    color:#777;
    font-size:14px;
}

/* ---------- GAME ---------- */

#game{
    display:none;
    position:fixed;
    inset:0;
}

.topbar{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    width:min(700px,95%);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    z-index:50;
}

.info{
    background:white;
    padding:9px 14px;
    border-radius:20px;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

#questionBox{
    position:absolute;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    width:min(650px,92%);
    background:white;
    border-radius:20px;
    padding:13px;
    text-align:center;
    z-index:40;
    box-shadow:0 7px 20px rgba(0,0,0,.15);
}

#questionType{
    font-size:14px;
    color:#777;
}

#question{
    font-size:24px;
    font-weight:bold;
    color:#333;
    margin-top:5px;
}

/* ---------- BALLOON AREA ---------- */

#sky{
    position:absolute;
    inset:0;
    overflow:hidden;
}

/* Balloon */

.balloon{
    position:absolute;
    width:125px;
    height:155px;
    cursor:pointer;
    transition:transform .15s;
    animation:floatSide 2.5s ease-in-out infinite alternate;
    user-select:none;
    touch-action:manipulation;
}

.balloon:hover{
    transform:scale(1.08);
}

.balloonBody{
    position:absolute;
    left:5px;
    top:0;
    width:115px;
    height:125px;
    border-radius:55% 55% 50% 50%;
    background:linear-gradient(135deg,#ff6b9a,#ff3f75);
    box-shadow:
        inset -12px -10px 15px rgba(0,0,0,.12),
        inset 10px 10px 15px rgba(255,255,255,.35),
        0 8px 15px rgba(0,0,0,.18);
}

.balloonBody::after{
    content:"";
    position:absolute;
    bottom:-8px;
    left:50%;
    transform:translateX(-50%);
    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-top:12px solid #e83e68;
}

.string{
    position:absolute;
    top:124px;
    left:62px;
    width:2px;
    height:35px;
    background:#777;
}

.clock{
    position:absolute;
    top:22px;
    left:17px;
    width:80px;
    height:80px;
    border-radius:50%;
    background:#fff;
    border:4px solid #333;
    box-shadow:0 3px 5px rgba(0,0,0,.2);
}

/* clock numbers */

.number{
    position:absolute;
    font-size:10px;
    font-weight:bold;
    color:#222;
}

.n12{top:2px;left:50%;transform:translateX(-50%);}
.n3{right:4px;top:50%;transform:translateY(-50%);}
.n6{bottom:2px;left:50%;transform:translateX(-50%);}
.n9{left:4px;top:50%;transform:translateY(-50%);}

/* clock hands */

.hand{
    position:absolute;
    left:50%;
    bottom:50%;
    transform-origin:bottom center;
    border-radius:5px;
}

.hour{
    width:5px;
    height:22px;
    background:#333;
}

.minute{
    width:3px;
    height:29px;
    background:#ff477e;
}

.center{
    position:absolute;
    width:8px;
    height:8px;
    background:#333;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

/* different balloon colors */

.color1 .balloonBody{
    background:linear-gradient(135deg,#ff7aa8,#ff3c70);
}

.color2 .balloonBody{
    background:linear-gradient(135deg,#6bdcff,#159ddd);
}

.color3 .balloonBody{
    background:linear-gradient(135deg,#a8e86f,#59bb38);
}

.color4 .balloonBody{
    background:linear-gradient(135deg,#c18cff,#8b52dd);
}

.color5 .balloonBody{
    background:linear-gradient(135deg,#ffd86b,#ffae25);
}

/* smooth side movement */

@keyframes floatSide{
    from{
        margin-left:-7px;
    }
    to{
        margin-left:7px;
    }
}

/* pop */

.pop{
    animation:pop .25s forwards !important;
}

@keyframes pop{
    0%{transform:scale(1);}
    50%{transform:scale(1.35);}
    100%{
        transform:scale(0);
        opacity:0;
    }
}

/* ---------- END ---------- */

#endScreen{
    display:none;
}

.end-card h2{
    font-size:38px;
    color:#ff5c8a;
    margin-bottom:15px;
}

.final-name{
    font-size:22px;
    color:#444;
    margin-bottom:10px;
}

.final-score{
    font-size:28px;
    color:#159ddd;
    font-weight:bold;
    margin-bottom:25px;
}

/* responsive */

@media(max-width:600px){

    .topbar{
        top:7px;
    }

    .info{
        font-size:13px;
        padding:8px 10px;
    }

    #questionBox{
        top:62px;
        padding:10px;
    }

    #question{
        font-size:20px;
    }

    .balloon{
        transform:scale(.85);
    }

    .balloon:hover{
        transform:scale(.92);
    }
}
</style>
</head>

<body>

<!-- START -->

<div id="startScreen" class="screen">

    <div class="start-card">

        <div class="logo">🎈⏰</div>

        <h1>Time Balloon Pop</h1>

        <div class="subtitle">
            Practice telling time in English!
        </div>

        <input
            id="playerName"
            type="text"
            placeholder="Enter your name"
            maxlength="20"
        >

        <button onclick="startGame()">
            START GAME
        </button>

        <div class="teacher">
            Teacher: Ms. Ramezanzadeh
        </div>

    </div>

</div>


<!-- GAME -->

<div id="game">

    <div class="topbar">

        <div class="info">
            ❤️ <span id="lives">5</span>
        </div>

        <div class="info">
            ⭐ <span id="score">0</span>
        </div>

        <div class="info">
            ⏱️ <span id="timer">30</span>
        </div>

    </div>


    <div id="questionBox">

        <div id="questionType">
            Find the correct time
        </div>

        <div id="question">
            quarter past three
        </div>

    </div>


    <div id="sky"></div>

</div>


<!-- END -->

<div id="endScreen" class="screen">

    <div class="end-card">

        <div class="logo" id="endEmoji">🏆</div>

        <h2 id="endTitle">
            TIME CHAMPION!
        </h2>

        <div class="final-name">
            Well done, <strong id="finalName"></strong>!
        </div>

        <div class="final-score">
            Score: <span id="finalScore">0</span>
        </div>

        <button onclick="location.reload()">
            PLAY AGAIN
        </button>

        <div class="teacher">
            Ms. Ramezanzadeh
        </div>

    </div>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

let playerName = "";
let score = 0;
let lives = 5;
let timeLeft = 30;

let timerInterval;
let balloonInterval;

let audioCtx;
let musicInterval;

let currentQuestion;
let balloons = [];


/* =========================
   QUESTIONS
========================= */

const questions = [

    {
        type:"Find the correct time",
        text:"quarter past three",
        hour:3,
        minute:15
    },

    {
        type:"Find the correct time",
        text:"half past six",
        hour:6,
        minute:30
    },

    {
        type:"Find the correct time",
        text:"quarter to nine",
        hour:8,
        minute:45
    },

    {
        type:"Find the correct time",
        text:"ten past five",
        hour:5,
        minute:10
    },

    {
        type:"Find the correct time",
        text:"twenty to seven",
        hour:6,
        minute:40
    },

    {
        type:"Find the correct time",
        text:"quarter past eight",
        hour:8,
        minute:15
    },

    {
        type:"Find the correct time",
        text:"half past two",
        hour:2,
        minute:30
    },

    {
        type:"Find the correct time",
        text:"twenty-five to twelve",
        hour:11,
        minute:35
    },

    {
        type:"Find the correct time",
        text:"five past four",
        hour:4,
        minute:5
    },

    {
        type:"Find the correct time",
        text:"quarter to five",
        hour:4,
        minute:45
    },

    {
        type:"Find the correct time",
        text:"twenty past nine",
        hour:9,
        minute:20
    },

    {
        type:"Find the correct time",
        text:"ten to eleven",
        hour:10,
        minute:50
    },

    /* Daily routine questions */

    {
        type:"What time do you have breakfast?",
        text:"7:00",
        hour:7,
        minute:0
    },

    {
        type:"What time do you go to school?",
        text:"8:00",
        hour:8,
        minute:0
    },

    {
        type:"What time do you have lunch?",
        text:"12:30",
        hour:12,
        minute:30
    },

    {
        type:"What time do you go to bed?",
        text:"10:00",
        hour:10,
        minute:0
    }

];


/* =========================
   START GAME
========================= */

function startGame(){

    playerName =
        document.getElementById("playerName").value.trim();

    if(playerName === ""){
        playerName = "Player";
    }

    document.getElementById("startScreen").style.display="none";

    document.getElementById("game").style.display="block";

    initAudio();

    nextQuestion();

    startTimer();

    startBalloonSpawner();

}


/* =========================
   AUDIO
========================= */

function initAudio(){

    try{

        audioCtx =
            new (window.AudioContext ||
            window.webkitAudioContext)();

        startMusic();

    }catch(e){

        console.log("Audio unavailable");

    }

}


function playTone(
    frequency,
    duration,
    type="sine",
    volume=.08
){

    if(!audioCtx) return;

    const oscillator =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    gain.gain.value =
        volume;

    oscillator.connect(gain);

    gain.connect(audioCtx.destination);

    oscillator.start();

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime + duration
    );

    oscillator.stop(
        audioCtx.currentTime + duration
    );
}


function correctSound(){

    playTone(700,.12,"sine",.12);

    setTimeout(()=>{
        playTone(1000,.18,"sine",.12);
    },100);

}


function wrongSound(){

    playTone(180,.25,"sawtooth",.1);

}


function winSound(){

    playTone(523,.15);

    setTimeout(()=>playTone(659,.15),150);
    setTimeout(()=>playTone(784,.25),300);

}


function loseSound(){

    playTone(300,.2,"sine",.1);

    setTimeout(()=>{
        playTone(180,.35,"sine",.1);
    },220);

}


/* =========================
   BACKGROUND MUSIC
========================= */

function startMusic(){

    if(!audioCtx) return;

    musicInterval =
        setInterval(()=>{

            playTone(
                260 + Math.random()*100,
                .08,
                "triangle",
                .025
            );

        },650);

}


/* =========================
   TIMER
========================= */

function startTimer(){

    clearInterval(timerInterval);

    timeLeft = 30;

    document.getElementById("timer").textContent =
        timeLeft;

    timerInterval =
        setInterval(()=>{

            timeLeft--;

            document.getElementById("timer").textContent =
                timeLeft;

            if(timeLeft <= 0){

                lives--;

                updateLives();

                wrongSound();

                if(lives <= 0){

                    gameOver();

                }else{

                    nextQuestion();

                }

            }

        },1000);

}


function resetTimer(){

    timeLeft = 30;

    document.getElementById("timer").textContent =
        timeLeft;

}


/* =========================
   QUESTION
========================= */

function nextQuestion(){

    resetTimer();

    currentQuestion =
        questions[
            Math.floor(
                Math.random()*questions.length
            )
        ];

    document.getElementById("questionType")
        .textContent =
        currentQuestion.type;

    document.getElementById("question")
        .textContent =
        currentQuestion.text;

    clearBalloons();

    createBalloons();

}


/* =========================
   CREATE BALLOONS
========================= */

function createBalloons(){

    clearBalloons();

    const correctIndex =
        Math.floor(Math.random()*6);

    for(let i=0;i<6;i++){

        let hour;
        let minute;

        if(i === correctIndex){

            hour =
                currentQuestion.hour;

            minute =
                currentQuestion.minute;

        }else{

            const fake =
                generateFakeTime();

            hour = fake.hour;
            minute = fake.minute;

        }

        createBalloon(
            hour,
            minute,
            i
        );

    }

}


/* =========================
   FAKE TIMES
========================= */

function generateFakeTime(){

    let h;
    let m;

    do{

        h =
            Math.floor(Math.random()*12)+1;

        m =
            Math.floor(Math.random()*12)*5;

    }while(
        h === currentQuestion.hour &&
        m === currentQuestion.minute
    );

    return {
        hour:h,
        minute:m
    };

}


/* =========================
   CLOCK
========================= */

function createClock(hour,minute){

    const clock =
        document.createElement("div");

    clock.className="clock";

    clock.innerHTML=`

        <div class="number n12">12</div>
        <div class="number n3">3</div>
        <div class="number n6">6</div>
        <div class="number n9">9</div>

        <div class="hand hour"></div>
        <div class="hand minute"></div>

        <div class="center"></div>
    `;

    const hourHand =
        clock.querySelector(".hour");

    const minuteHand =
        clock.querySelector(".minute");

    let h =
        hour % 12;

    const hourAngle =
        h*30 + minute*.5;

    const minuteAngle =
        minute*6;

    hourHand.style.transform =
        `translateX(-50%) rotate(${hourAngle}deg)`;

    minuteHand.style.transform =
        `translateX(-50%) rotate(${minuteAngle}deg)`;

    return clock;

}


/* =========================
   BALLOON
========================= */

function createBalloon(hour,minute,index){

    const balloon =
        document.createElement("div");

    balloon.className =
        "balloon color"+((index%5)+1);

    balloon.dataset.hour = hour;
    balloon.dataset.minute = minute;

    balloon.innerHTML = `
        <div class="balloonBody"></div>
        <div class="string"></div>
    `;

    balloon.querySelector(".balloonBody")
        .appendChild(
            createClock(hour,minute)
        );

    /* random horizontal position */

    const screenWidth =
        window.innerWidth;

    const maxX =
        Math.max(
            10,
            screenWidth-140
        );

    balloon.style.left =
        Math.random()*maxX+"px";

    /* Important:
       Balloons always start BELOW
       and travel slowly upward.
    */

    const startBottom =
        -190 - Math.random()*350;

    balloon.style.bottom =
        startBottom+"px";

    /* Different speeds */

    const duration =
        15 + Math.random()*8;

    balloon.style.transition =
        `bottom ${duration}s linear`;

    document.getElementById("sky")
        .appendChild(balloon);

    balloons.push(balloon);

    /* Move upward */

    requestAnimationFrame(()=>{

        balloon.style.bottom =
            (window.innerHeight + 180)+"px";

    });

    /* When it reaches the top:
       remove it and create a new one.
    */

    setTimeout(()=>{

        if(
            balloon.parentNode &&
            !balloon.classList.contains("pop")
        ){

            balloon.remove();

            balloons =
                balloons.filter(
                    b=>b!==balloon
                );

        }

    },(duration+1)*1000);


    balloon.addEventListener(
        "click",
        ()=>checkBalloon(balloon)
    );

    balloon.addEventListener(
        "touchstart",
        (e)=>{
            e.preventDefault();
            checkBalloon(balloon);
        },
        {passive:false}
    );

}


/* =========================
   SPAWN MORE BALLOONS
========================= */

function startBalloonSpawner(){

    clearInterval(balloonInterval);

    balloonInterval =
        setInterval(()=>{

            /* Keep around 5–7 balloons
               on the screen */

            if(balloons.length < 7){

                const fake =
                    generateFakeTime();

                createBalloon(
                    fake.hour,
                    fake.minute,
                    Math.floor(Math.random()*5)
                );

            }

        },1800);

}


/* =========================
   CHECK BALLOON
========================= */

function checkBalloon(balloon){

    if(
        balloon.classList.contains("pop")
    ) return;

    const hour =
        Number(balloon.dataset.hour);

    const minute =
        Number(balloon.dataset.minute);

    if(
        hour === currentQuestion.hour &&
        minute === currentQuestion.minute
    ){

        /* CORRECT */

        score += 10;

        document.getElementById("score")
            .textContent = score;

        balloon.classList.add("pop");

        correctSound();

        setTimeout(()=>{

            if(score >= 100){

                winGame();

            }else{

                nextQuestion();

            }

        },350);

    }else{

        /* WRONG */

        lives--;

        updateLives();

        balloon.classList.add("pop");

        wrongSound();

        if(lives <= 0){

            setTimeout(gameOver,250);

        }

    }

}


/* =========================
   LIVES
========================= */

function updateLives(){

    document.getElementById("lives")
        .textContent = lives;

}


/* =========================
   CLEAR BALLOONS
========================= */

function clearBalloons(){

    balloons.forEach(
        balloon=>{
            if(balloon.parentNode){
                balloon.remove();
            }
        }
    );

    balloons=[];

}


/* =========================
   WIN
========================= */

function winGame(){

    stopGame();

    winSound();

    document.getElementById("game")
        .style.display="none";

    document.getElementById("endScreen")
        .style.display="flex";

    document.getElementById("endEmoji")
        .textContent="🏆";

    document.getElementById("endTitle")
        .textContent="TIME CHAMPION!";

    document.getElementById("finalName")
        .textContent=playerName;

    document.getElementById("finalScore")
        .textContent=score;

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    stopGame();

    loseSound();

    document.getElementById("game")
        .style.display="none";

    document.getElementById("endScreen")
        .style.display="flex";

    document.getElementById("endEmoji")
        .textContent="😢";

    document.getElementById("endTitle")
        .textContent="GAME OVER";

    document.getElementById("finalName")
        .textContent=playerName;

    document.getElementById("finalScore")
        .textContent=score;

}


/* =========================
   STOP GAME
========================= */

function stopGame(){

    clearInterval(timerInterval);

    clearInterval(balloonInterval);

    clearInterval(musicInterval);

    clearBalloons();

}

</script>

</body>
</html>
