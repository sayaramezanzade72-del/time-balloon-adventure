<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Balloon Pop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  overflow:hidden;
  min-height:100vh;
  background:linear-gradient(#82d9ff 0%,#c9f3ff 62%,#8bd66d 62%,#6cc45c 100%);
}

/* ---------- SCREENS ---------- */

.screen{
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hidden{
  display:none !important;
}

/* ---------- START ---------- */

.start-card{
  width:min(92%,500px);
  background:white;
  border-radius:30px;
  padding:30px 24px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.18);
}

.logo{
  font-size:70px;
  margin-bottom:5px;
}

.start-card h1{
  color:#ff6b6b;
  font-size:36px;
  margin-bottom:8px;
}

.subtitle{
  color:#555;
  font-size:18px;
  margin-bottom:25px;
}

.start-card input{
  width:100%;
  padding:15px;
  border:3px solid #bdefff;
  border-radius:15px;
  font-size:18px;
  text-align:center;
  outline:none;
  margin-bottom:15px;
}

.start-btn{
  width:100%;
  border:none;
  border-radius:18px;
  padding:15px;
  font-size:21px;
  font-weight:bold;
  color:white;
  background:linear-gradient(135deg,#ff7b7b,#ff4f81);
  cursor:pointer;
  box-shadow:0 6px 0 #d83c64;
}

.start-btn:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #d83c64;
}

.teacher{
  margin-top:22px;
  color:#777;
  font-size:14px;
}

/* ---------- GAME ---------- */

#game{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}

/* top bar */

.topbar{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(94%,850px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:100;
}

.info{
  background:white;
  border-radius:18px;
  padding:9px 15px;
  font-size:17px;
  font-weight:bold;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.lives{
  color:#ff4f67;
}

.score{
  color:#477cff;
}

/* question */

.question-box{
  position:absolute;
  top:72px;
  left:50%;
  transform:translateX(-50%);
  width:min(92%,650px);
  background:white;
  border-radius:22px;
  padding:13px 20px;
  text-align:center;
  box-shadow:0 7px 20px rgba(0,0,0,.14);
  z-index:100;
}

.question-label{
  color:#777;
  font-size:14px;
  margin-bottom:3px;
}

#question{
  color:#263b73;
  font-size:25px;
  font-weight:bold;
}

/* ---------- CLOUDS ---------- */

.cloud{
  position:absolute;
  background:white;
  border-radius:100px;
  opacity:.8;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:white;
  border-radius:50%;
}

.cloud1{
  width:120px;
  height:35px;
  top:20%;
  left:5%;
}

.cloud1:before{
  width:55px;
  height:55px;
  left:18px;
  bottom:5px;
}

.cloud1:after{
  width:65px;
  height:65px;
  right:15px;
  bottom:2px;
}

.cloud2{
  width:150px;
  height:40px;
  top:38%;
  right:4%;
}

.cloud2:before{
  width:65px;
  height:65px;
  left:25px;
  bottom:4px;
}

.cloud2:after{
  width:70px;
  height:70px;
  right:22px;
  bottom:0;
}

/* ---------- BALLOON AREA ---------- */

#balloonArea{
  position:absolute;
  inset:0;
  overflow:hidden;
}

/* balloon */

.balloon{
  position:absolute;
  width:105px;
  height:125px;
  bottom:-150px;
  border-radius:52% 52% 48% 48%;
  cursor:pointer;
  z-index:20;
  animation:floatUp 24s linear forwards;
  filter:drop-shadow(0 7px 5px rgba(0,0,0,.16));
}

.balloon::before{
  content:"";
  position:absolute;
  width:11px;
  height:11px;
  bottom:-5px;
  left:47px;
  transform:rotate(45deg);
  background:inherit;
}

.balloon::after{
  content:"";
  position:absolute;
  width:2px;
  height:55px;
  background:#777;
  bottom:-58px;
  left:52px;
}

.balloon:nth-child(1){
  left:7%;
  background:#ff6b81;
}

.balloon:nth-child(2){
  left:26%;
  background:#6c9cff;
  animation-delay:1.2s;
}

.balloon:nth-child(3){
  left:45%;
  background:#ffd34e;
  animation-delay:2.4s;
}

.balloon:nth-child(4){
  left:64%;
  background:#65d69b;
  animation-delay:3.6s;
}

.balloon:nth-child(5){
  left:83%;
  background:#b277e8;
  animation-delay:4.8s;
}

@keyframes floatUp{
  0%{
    bottom:-160px;
  }
  100%{
    bottom:calc(100vh + 170px);
  }
}

/* ---------- CLOCK ---------- */

.clock{
  position:absolute;
  width:78px;
  height:78px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:white;
  border:4px solid #33415c;
  border-radius:50%;
  box-shadow:inset 0 0 0 3px #e9eef5;
}

.clock::before{
  content:"12";
  position:absolute;
  top:4px;
  left:50%;
  transform:translateX(-50%);
  font-size:10px;
  font-weight:bold;
  color:#333;
}

.clock::after{
  content:"6";
  position:absolute;
  bottom:4px;
  left:50%;
  transform:translateX(-50%);
  font-size:10px;
  font-weight:bold;
  color:#333;
}

/* clock hands */

.hour,
.minute{
  position:absolute;
  left:50%;
  bottom:50%;
  transform-origin:bottom center;
  border-radius:5px;
}

.hour{
  width:5px;
  height:22px;
  background:#28344b;
}

.minute{
  width:4px;
  height:29px;
  background:#ff526d;
}

.center{
  position:absolute;
  width:9px;
  height:9px;
  background:#28344b;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:5;
}

/* clock times */

.t0315 .hour{
  transform:translateX(-50%) rotate(97.5deg);
}

.t0315 .minute{
  transform:translateX(-50%) rotate(90deg);
}

.t0630 .hour{
  transform:translateX(-50%) rotate(195deg);
}

.t0630 .minute{
  transform:translateX(-50%) rotate(180deg);
}

.t0845 .hour{
  transform:translateX(-50%) rotate(262.5deg);
}

.t0845 .minute{
  transform:translateX(-50%) rotate(270deg);
}

.t0510 .hour{
  transform:translateX(-50%) rotate(155deg);
}

.t0510 .minute{
  transform:translateX(-50%) rotate(60deg);
}

.t0640 .hour{
  transform:translateX(-50%) rotate(200deg);
}

.t0640 .minute{
  transform:translateX(-50%) rotate(240deg);
}

.t0815 .hour{
  transform:translateX(-50%) rotate(127.5deg);
}

.t0815 .minute{
  transform:translateX(-50%) rotate(90deg);
}

.t0230 .hour{
  transform:translateX(-50%) rotate(75deg);
}

.t0230 .minute{
  transform:translateX(-50%) rotate(180deg);
}

.t1135 .hour{
  transform:translateX(-50%) rotate(347.5deg);
}

.t1135 .minute{
  transform:translateX(-50%) rotate(210deg);
}

.t0405 .hour{
  transform:translateX(-50%) rotate(122.5deg);
}

.t0405 .minute{
  transform:translateX(-50%) rotate(30deg);
}

.t0445 .hour{
  transform:translateX(-50%) rotate(142.5deg);
}

.t0445 .minute{
  transform:translateX(-50%) rotate(270deg);
}

.t0920 .hour{
  transform:translateX(-50%) rotate(280deg);
}

.t0920 .minute{
  transform:translateX(-50%) rotate(120deg);
}

.t1050 .hour{
  transform:translateX(-50%) rotate(325deg);
}

.t1050 .minute{
  transform:translateX(-50%) rotate(300deg);
}

.t0700 .hour{
  transform:translateX(-50%) rotate(210deg);
}

.t0700 .minute{
  transform:translateX(-50%) rotate(0deg);
}

.t0800 .hour{
  transform:translateX(-50%) rotate(240deg);
}

.t0800 .minute{
  transform:translateX(-50%) rotate(0deg);
}

.t1230 .hour{
  transform:translateX(-50%) rotate(15deg);
}

.t1230 .minute{
  transform:translateX(-50%) rotate(180deg);
}

.t1000 .hour{
  transform:translateX(-50%) rotate(300deg);
}

.t1000 .minute{
  transform:translateX(-50%) rotate(0deg);
}

/* ---------- CHARACTER ---------- */

.character{
  position:absolute;
  right:18px;
  bottom:12px;
  width:125px;
  height:150px;
  z-index:80;
  animation:bob 2.5s ease-in-out infinite;
}

@keyframes bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}

.character svg{
  width:100%;
  height:100%;
}

/* speech */

.speech{
  position:absolute;
  right:135px;
  bottom:105px;
  background:white;
  border-radius:15px;
  padding:8px 12px;
  font-size:13px;
  font-weight:bold;
  color:#3e4e86;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
  white-space:nowrap;
}

.speech:after{
  content:"";
  position:absolute;
  right:-9px;
  bottom:15px;
  border-width:7px 0 7px 10px;
  border-style:solid;
  border-color:transparent transparent transparent white;
}

/* ---------- MESSAGE ---------- */

.message{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:25px 35px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  z-index:300;
  min-width:280px;
}

.message h2{
  font-size:34px;
  margin-bottom:8px;
}

.message p{
  color:#555;
  margin-bottom:18px;
}

.message button{
  border:none;
  background:#ff6680;
  color:white;
  font-weight:bold;
  font-size:17px;
  padding:12px 25px;
  border-radius:14px;
  cursor:pointer;
}

/* ---------- RESPONSIVE ---------- */

@media(max-width:600px){

  .start-card{
    padding:25px 18px;
  }

  .logo{
    font-size:55px;
  }

  .start-card h1{
    font-size:29px;
  }

  .topbar{
    top:8px;
  }

  .info{
    font-size:14px;
    padding:7px 10px;
  }

  .question-box{
    top:61px;
    padding:10px 12px;
  }

  #question{
    font-size:19px;
  }

  .balloon{
    width:88px;
    height:108px;
  }

  .balloon::before{
    left:39px;
  }

  .balloon::after{
    left:44px;
  }

  .clock{
    width:66px;
    height:66px;
  }

  .character{
    width:90px;
    height:110px;
    right:4px;
    bottom:3px;
  }

  .speech{
    right:75px;
    bottom:80px;
    font-size:11px;
  }
}

@media(max-width:420px){

  .balloon{
    width:76px;
    height:96px;
  }

  .balloon:nth-child(1){left:2%}
  .balloon:nth-child(2){left:22%}
  .balloon:nth-child(3){left:42%}
  .balloon:nth-child(4){left:62%}
  .balloon:nth-child(5){left:82%}

  .clock{
    width:58px;
    height:58px;
  }

  .question-box{
    width:94%;
  }

  #question{
    font-size:17px;
  }
}
</style>
</head>

<body>

<!-- START SCREEN -->

<div id="startScreen" class="screen">

</div>

<div id="game" class="hidden">

<script>

/* =========================
   GAME DATA
========================= */

const questions = [

  {
    text:"Find: quarter past three",
    time:"03:15",
    className:"t0315"
  },

  {
    text:"Find: half past six",
    time:"06:30",
    className:"t0630"
  },

  {
    text:"Find: quarter to nine",
    time:"08:45",
    className:"t0845"
  },

  {
    text:"Find: ten past five",
    time:"05:10",
    className:"t0510"
  },

  {
    text:"Find: twenty to seven",
    time:"06:40",
    className:"t0640"
  },

  {
    text:"Find: quarter past eight",
    time:"08:15",
    className:"t0815"
  },

  {
    text:"Find: half past two",
    time:"02:30",
    className:"t0230"
  },

  {
    text:"Find: twenty-five to twelve",
    time:"11:35",
    className:"t1135"
  },

  {
    text:"Find: five past four",
    time:"04:05",
    className:"t0405"
  },

  {
    text:"Find: quarter to five",
    time:"04:45",
    className:"t0445"
  },

  {
    text:"Find: twenty past nine",
    time:"09:20",
    className:"t0920"
  },

  {
    text:"Find: ten to eleven",
    time:"10:50",
    className:"t1050"
  },

  {
    text:"What time do you have breakfast?",
    time:"07:00",
    className:"t0700"
  },

  {
    text:"What time do you go to school?",
    time:"08:00",
    className:"t0800"
  },

  {
    text:"What time do you have lunch?",
    time:"12:30",
    className:"t1230"
  },

  {
    text:"What time do you go to bed?",
    time:"10:00",
    className:"t1000"
  }

];


/* =========================
   VARIABLES
========================= */

let playerName = "";
let currentQuestion = 0;
let lives = 5;
let score = 0;
let finishedBalloons = 0;
let gameEnded = false;

let audioContext;
let musicTimer;


/* =========================
   START
========================= */

function startGame(){

  const input = document.getElementById("playerName");

  playerName = input.value.trim();

  if(!playerName){
    playerName = "Player";
  }

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  lives = 5;
  score = 0;
  currentQuestion = 0;
  gameEnded = false;

  updateUI();

  startAudio();

  showQuestion();
}


/* =========================
   UI
========================= */

function updateUI(){

  document.getElementById("lives").textContent = lives;
  document.getElementById("score").textContent = score;

}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(){

  if(gameEnded) return;

  if(currentQuestion >= questions.length){

    winGame();
    return;

  }

  finishedBalloons = 0;

  const q = questions[currentQuestion];

  document.getElementById("question").textContent = q.text;

  createBalloons(q);

}


/* =========================
   CREATE BALLOONS
========================= */

function createBalloons(q){

  const area = document.getElementById("balloonArea");

  area.innerHTML = "";

  /*
    One correct clock + four wrong clocks.
    We shuffle the five clocks.
  */

  let choices = [
    q.className
  ];

  const allTimes = questions
    .map(item => item.className)
    .filter(item => item !== q.className);

  shuffle(allTimes);

  choices.push(...allTimes.slice(0,4));

  shuffle(choices);


  choices.forEach((clockClass,index)=>{

    const balloon = document.createElement("div");

    balloon.className = "balloon";

    balloon.style.animationDelay = `${index * 1.1}s`;

    const clock = document.createElement("div");

    clock.className = `clock ${clockClass}`;

    const hour = document.createElement("div");
    hour.className = "hour";

    const minute = document.createElement("div");
    minute.className = "minute";

    const center = document.createElement("div");
    center.className = "center";

    clock.appendChild(hour);
    clock.appendChild(minute);
    clock.appendChild(center);

    balloon.appendChild(clock);

    balloon.dataset.answer =
      clockClass === q.className
      ? "correct"
      : "wrong";

    balloon.addEventListener("click",()=>{
      balloonClicked(balloon);
    });

    /*
      When each balloon reaches the top,
      count it as finished.
    */

    balloon.addEventListener("animationend",()=>{

      if(balloon.dataset.done === "true") return;

      balloon.dataset.done = "true";

      finishedBalloons++;

      if(finishedBalloons >= 5){

        setTimeout(()=>{

          if(!gameEnded){

            currentQuestion++;

            showQuestion();

          }

        },300);

      }

    });

    area.appendChild(balloon);

  });

}


/* =========================
   BALLOON CLICK
========================= */

function balloonClicked(balloon){

  if(gameEnded) return;

  if(balloon.dataset.clicked === "true") return;

  balloon.dataset.clicked = "true";

  if(balloon.dataset.answer === "correct"){

    correctSound();

    score += 10;

    updateUI();

    balloon.style.transform = "scale(1.4)";
    balloon.style.opacity = "0";

    setTimeout(()=>{

      currentQuestion++;

      showQuestion();

    },500);

  }else{

    wrongSound();

    lives--;

    updateUI();

    balloon.style.transform = "scale(.7)";
    balloon.style.opacity = "0";

    setTimeout(()=>{

      balloon.remove();

    },200);

    if(lives <= 0){

      loseGame();

    }

  }

}


/* =========================
   WIN
========================= */

function winGame(){

  gameEnded = true;

  winSound();

  document.getElementById("messageTitle").textContent =
    "🎉 Excellent, " + playerName + "!";

  document.getElementById("messageText").innerHTML =
    `You finished the game!<br>
     ⭐ Score: ${score}<br><br>
     Great job telling the time!`;

  document.getElementById("message").classList.remove("hidden");

}


/* =========================
   LOSE
========================= */

function loseGame(){

  gameEnded = true;

  loseSound();

  document.getElementById("messageTitle").textContent =
    "💔 GAME OVER";

  document.getElementById("messageText").innerHTML =
    `${playerName}, don't give up!<br>
     ⭐ Score: ${score}<br><br>
     Try again and practice telling the time.`;

  document.getElementById("message").classList.remove("hidden");

}


/* =========================
   RESTART
========================= */

function restartGame(){

  document.getElementById("message").classList.add("hidden");

  lives = 5;
  score = 0;
  currentQuestion = 0;
  gameEnded = false;

  updateUI();

  showQuestion();

}


/* =========================
   SHUFFLE
========================= */

function shuffle(array){

  for(let i=array.length-1;i>0;i--){

    const j = Math.floor(Math.random()*(i+1));

    [array[i],array[j]] =
    [array[j],array[i]];

  }

  return array;

}


/* =========================
   SOUND
========================= */

function startAudio(){

  try{

    audioContext =
      new (window.AudioContext || window.webkitAudioContext)();

    if(audioContext.state === "suspended"){
      audioContext.resume();
    }

    playMusic();

  }catch(e){}

}


function tone(freq,duration,type="sine",volume=.08){

  if(!audioContext) return;

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type = type;
  oscillator.frequency.value = freq;

  gain.gain.setValueAtTime(
    volume,
    audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime + duration
  );

}


function correctSound(){

  tone(660,.12,"sine",.1);

  setTimeout(()=>{
    tone(880,.18,"sine",.1);
  },120);

}

/* =========================
   BACKGROUND MUSIC
========================= */

function playMusic(){

  if(!audioContext) return;

  const notes = [
    392,
    440,
    494,
    440
  ];

  let i = 0;

  musicTimer = setInterval(()=>{

    if(gameEnded) return;

    tone(
      notes[i % notes.length],
      .35,
      "sine",
      .025
    );

    i++;

  },700);

}
