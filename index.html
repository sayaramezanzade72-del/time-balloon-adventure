<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Balloon Adventure</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  overflow:hidden;
  background:linear-gradient(
    #78d8ff 0%,
    #d4f7ff 68%,
    #8bd66b 68%,
    #65bd57 100%
  );
}

button,input{
  font-family:Arial,sans-serif;
}

.hidden{
  display:none!important;
}

/* ================= START ================= */

#startScreen{
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.startCard{
  width:min(92%,500px);
  background:#fff;
  border-radius:30px;
  padding:30px 25px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.18);
}

.logo{
  font-size:65px;
  margin-bottom:5px;
}

.startCard h1{
  color:#ff5d7a;
  font-size:35px;
  margin-bottom:10px;
}

.startCard p{
  color:#555;
  font-size:17px;
  margin-bottom:25px;
}

.startCard input{
  width:100%;
  padding:15px;
  border:3px solid #bcecff;
  border-radius:15px;
  font-size:18px;
  text-align:center;
  outline:none;
  margin-bottom:15px;
}

.startBtn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:17px;
  background:linear-gradient(135deg,#ff7086,#ff4d89);
  color:white;
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 6px #d83d66;
}

.startBtn:active{
  transform:translateY(4px);
  box-shadow:0 2px #d83d66;
}

.teacher{
  margin-top:22px;
  color:#777;
  font-size:14px;
}

/* ================= GAME ================= */

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

.topBar{
  position:absolute;
  z-index:100;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  width:min(94%,850px);
  display:flex;
  justify-content:space-between;
}

.info{
  background:white;
  border-radius:17px;
  padding:8px 14px;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
  font-size:16px;
  font-weight:bold;
}

.lives{
  color:#ff4d69;
}

.score{
  color:#477cff;
}

/* ================= PART ================= */

.partLabel{
  position:absolute;
  top:57px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  color:#586a9e;
  padding:6px 16px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  z-index:100;
}

/* ================= QUESTION ================= */

.questionBox{
  position:absolute;
  top:86px;
  left:50%;
  transform:translateX(-50%);
  width:min(92%,680px);
  background:white;
  border-radius:22px;
  padding:12px 18px;
  text-align:center;
  z-index:100;
  box-shadow:0 7px 20px rgba(0,0,0,.14);
}

.questionSmall{
  color:#777;
  font-size:14px;
  margin-bottom:4px;
}

#question{
  color:#293d75;
  font-size:24px;
  font-weight:bold;
}

.digitalBox{
  margin-top:8px;
  display:flex;
  justify-content:center;
}

.digitalTime{
  background:#202b40;
  color:#fff;
  font-family:"Courier New",monospace;
  font-size:39px;
  font-weight:bold;
  letter-spacing:3px;
  padding:5px 18px;
  border-radius:12px;
}

/* ================= CLOUDS ================= */

.cloud{
  position:absolute;
  background:white;
  border-radius:100px;
  opacity:.75;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:white;
  border-radius:50%;
}

.cloud1{
  width:120px;
  height:34px;
  top:20%;
  left:5%;
}

.cloud1:before{
  width:55px;
  height:55px;
  left:15px;
  bottom:3px;
}

.cloud1:after{
  width:60px;
  height:60px;
  right:15px;
  bottom:0;
}

.cloud2{
  width:150px;
  height:38px;
  top:38%;
  right:4%;
}

.cloud2:before{
  width:65px;
  height:65px;
  left:20px;
  bottom:2px;
}

.cloud2:after{
  width:70px;
  height:70px;
  right:20px;
  bottom:0;
}

/* ================= BALLOONS ================= */

#balloonArea{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.balloon{
  position:absolute;
  width:102px;
  height:122px;
  bottom:-160px;
  border-radius:52% 52% 48% 48%;
  cursor:pointer;
  z-index:20;
  animation:floatUp 24s linear forwards;
  filter:drop-shadow(0 7px 5px rgba(0,0,0,.17));
  transition:transform .2s,opacity .2s;
}

.balloon:before{
  content:"";
  position:absolute;
  width:11px;
  height:11px;
  left:45px;
  bottom:-5px;
  background:inherit;
  transform:rotate(45deg);
}

.balloon:after{
  content:"";
  position:absolute;
  width:2px;
  height:55px;
  background:#777;
  left:50px;
  bottom:-58px;
}

.balloon:nth-child(1){
  left:6%;
  background:#ff6d83;
}

.balloon:nth-child(2){
  left:26%;
  background:#6597ff;
}

.balloon:nth-child(3){
  left:46%;
  background:#ffd34f;
}

.balloon:nth-child(4){
  left:66%;
  background:#62d69b;
}

.balloon:nth-child(5){
  left:86%;
  background:#ae78e7;
}

@keyframes floatUp{
  from{
    bottom:-160px;
  }

  to{
    bottom:calc(100vh + 180px);
  }
}

/* ================= CLOCK ================= */

.clock{
  position:absolute;
  width:78px;
  height:78px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:white;
  border:4px solid #303b54;
  border-radius:50%;
  box-shadow:inset 0 0 0 3px #edf1f7;
}

.number{
  position:absolute;
  font-size:8px;
  font-weight:bold;
  color:#333;
}

.n12{
  top:3px;
  left:50%;
  transform:translateX(-50%);
}

.n3{
  right:5px;
  top:50%;
  transform:translateY(-50%);
}

.n6{
  bottom:3px;
  left:50%;
  transform:translateX(-50%);
}

.n9{
  left:5px;
  top:50%;
  transform:translateY(-50%);
}

.hour,
.minute{
  position:absolute;
  left:50%;
  bottom:50%;
  transform-origin:bottom center;
  border-radius:5px;
}

.hour{
  width:5px;
  height:22px;
  background:#27344d;
}

.minute{
  width:4px;
  height:29px;
  background:#ff4e68;
}

.center{
  position:absolute;
  width:9px;
  height:9px;
  background:#27344d;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

/* ================= TIMES ================= */

.t0315 .hour{transform:translateX(-50%) rotate(97.5deg)}
.t0315 .minute{transform:translateX(-50%) rotate(90deg)}

.t0630 .hour{transform:translateX(-50%) rotate(195deg)}
.t0630 .minute{transform:translateX(-50%) rotate(180deg)}

.t0845 .hour{transform:translateX(-50%) rotate(262.5deg)}
.t0845 .minute{transform:translateX(-50%) rotate(270deg)}

.t0510 .hour{transform:translateX(-50%) rotate(155deg)}
.t0510 .minute{transform:translateX(-50%) rotate(60deg)}

.t0640 .hour{transform:translateX(-50%) rotate(200deg)}
.t0640 .minute{transform:translateX(-50%) rotate(240deg)}

.t0815 .hour{transform:translateX(-50%) rotate(127.5deg)}
.t0815 .minute{transform:translateX(-50%) rotate(90deg)}

.t0230 .hour{transform:translateX(-50%) rotate(75deg)}
.t0230 .minute{transform:translateX(-50%) rotate(180deg)}

.t1135 .hour{transform:translateX(-50%) rotate(347.5deg)}
.t1135 .minute{transform:translateX(-50%) rotate(210deg)}

.t0405 .hour{transform:translateX(-50%) rotate(122.5deg)}
.t0405 .minute{transform:translateX(-50%) rotate(30deg)}

.t0445 .hour{transform:translateX(-50%) rotate(142.5deg)}
.t0445 .minute{transform:translateX(-50%) rotate(270deg)}

.t0920 .hour{transform:translateX(-50%) rotate(280deg)}
.t0920 .minute{transform:translateX(-50%) rotate(120deg)}

.t1050 .hour{transform:translateX(-50%) rotate(325deg)}
.t1050 .minute{transform:translateX(-50%) rotate(300deg)}

.t0700 .hour{transform:translateX(-50%) rotate(210deg)}
.t0700 .minute{transform:translateX(-50%) rotate(0deg)}

.t0730 .hour{transform:translateX(-50%) rotate(225deg)}
.t0730 .minute{transform:translateX(-50%) rotate(180deg)}

.t0800 .hour{transform:translateX(-50%) rotate(240deg)}
.t0800 .minute{transform:translateX(-50%) rotate(0deg)}

.t0830 .hour{transform:translateX(-50%) rotate(255deg)}
.t0830 .minute{transform:translateX(-50%) rotate(180deg)}

.t0900 .hour{transform:translateX(-50%) rotate(270deg)}
.t0900 .minute{transform:translateX(-50%) rotate(0deg)}

.t0930 .hour{transform:translateX(-50%) rotate(285deg)}
.t0930 .minute{transform:translateX(-50%) rotate(180deg)}

.t1000 .hour{transform:translateX(-50%) rotate(300deg)}
.t1000 .minute{transform:translateX(-50%) rotate(0deg)}

.t1030 .hour{transform:translateX(-50%) rotate(315deg)}
.t1030 .minute{transform:translateX(-50%) rotate(180deg)}

.t1100 .hour{transform:translateX(-50%) rotate(330deg)}
.t1100 .minute{transform:translateX(-50%) rotate(0deg)}

.t1200 .hour{transform:translateX(-50%) rotate(0deg)}
.t1200 .minute{transform:translateX(-50%) rotate(0deg)}

.t1230 .hour{transform:translateX(-50%) rotate(15deg)}
.t1230 .minute{transform:translateX(-50%) rotate(180deg)}

/* ================= CHARACTER ================= */

.character{
  position:absolute;
  right:12px;
  bottom:4px;
  width:120px;
  height:145px;
  z-index:80;
  animation:bob 2.5s ease-in-out infinite;
}

.character svg{
  width:100%;
  height:100%;
}

@keyframes bob{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-7px);
  }
}

.speech{
  position:absolute;
  right:130px;
  bottom:108px;
  background:white;
  color:#40538d;
  font-size:13px;
  font-weight:bold;
  padding:8px 12px;
  border-radius:14px;
  z-index:90;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}

/* ================= MESSAGE ================= */

.message{
  position:absolute;
  z-index:300;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:white;
  width:min(90%,400px);
  padding:30px;
  border-radius:27px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.message h2{
  color:#ff5e7d;
  font-size:34px;
  margin-bottom:10px;
}

.message p{
  color:#555;
  line-height:1.6;
  margin-bottom:18px;
}

.message button{
  border:none;
  background:#ff6682;
  color:white;
  font-size:17px;
  font-weight:bold;
  padding:12px 25px;
  border-radius:14px;
  cursor:pointer;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .startCard h1{
    font-size:28px;
  }

  .logo{
    font-size:55px;
  }

  .info{
    font-size:13px;
    padding:7px 10px;
  }

  .partLabel{
    top:53px;
  }

  .questionBox{
    top:78px;
    padding:10px;
  }

  #question{
    font-size:18px;
  }

  .digitalTime{
    font-size:30px;
  }

  .balloon{
    width:88px;
    height:108px;
  }

  .balloon:before{
    left:39px;
  }

  .balloon:after{
    left:43px;
  }

  .clock{
    width:66px;
    height:66px;
  }

  .character{
    width:85px;
    height:105px;
  }

  .speech{
    right:70px;
    bottom:75px;
    font-size:10px;
  }
}

@media(max-width:420px){

  .balloon{
    width:75px;
    height:95px;
  }

  .balloon:nth-child(1){left:2%}
  .balloon:nth-child(2){left:22%}
  .balloon:nth-child(3){left:42%}
  .balloon:nth-child(4){left:62%}
  .balloon:nth-child(5){left:82%}

  .clock{
    width:58px;
    height:58px;
  }
}
</style>
</head>


<body>

<div id="startScreen">

<script>

/* =====================================================
   QUESTIONS
===================================================== */

const part1Questions = [

  {
    text:"Find: quarter past three",
    className:"t0315"
  },

  {
    text:"Find: half past six",
    className:"t0630"
  },

  {
    text:"Find: quarter to nine",
    className:"t0845"
  },

  {
    text:"Find: ten past five",
    className:"t0510"
  },

  {
    text:"Find: twenty to seven",
    className:"t0640"
  },

  {
    text:"Find: quarter past eight",
    className:"t0815"
  },

  {
    text:"Find: half past two",
    className:"t0230"
  },

  {
    text:"Find: twenty-five to twelve",
    className:"t1135"
  },

  {
    text:"Find: five past four",
    className:"t0405"
  },

  {
    text:"Find: quarter to five",
    className:"t0445"
  },

  {
    text:"Find: twenty past nine",
    className:"t0920"
  },

  {
    text:"Find: ten to eleven",
    className:"t1050"
  }

];


const part2Questions = [

  {
    time:"7:00",
    className:"t0700"
  },

  {
    time:"7:30",
    className:"t0730"
  },

  {
    time:"8:00",
    className:"t0800"
  },

  {
    time:"8:30",
    className:"t0830"
  },

  {
    time:"9:00",
    className:"t0900"
  },

  {
    time:"9:30",
    className:"t0930"
  },

  {
    time:"10:00",
    className:"t1000"
  },

  {
    time:"10:30",
    className:"t1030"
  },

  {
    time:"11:00",
    className:"t1100"
  },

  {
    time:"12:00",
    className:"t1200"
  },

  {
    time:"12:30",
    className:"t1230"
  }

];


/* =====================================================
   VARIABLES
===================================================== */

let playerName = "";

let lives = 5;

let score = 0;

let part = 1;

let questionIndex = 0;

let currentQuestions = [];

let finishedBalloons = 0;

let gameEnded = false;

let audioContext = null;

let musicInterval = null;


/* =====================================================
   START BUTTON
===================================================== */

document
  .getElementById("startButton")
  .addEventListener(
    "click",
    startGame
  );


/* =====================================================
   PLAY AGAIN BUTTON
===================================================== */

document
  .getElementById("playAgainButton")
  .addEventListener(
    "click",
    restartGame
  );


/* =====================================================
   START GAME
===================================================== */

function startGame(){

  const input =
    document.getElementById("playerName");

  playerName =
    input.value.trim();

  if(playerName === ""){
    playerName = "Player";
  }

  document
    .getElementById("startScreen")
    .classList.add("hidden");

  document
    .getElementById("game")
    .classList.remove("hidden");

  lives = 5;

  score = 0;

  part = 1;

  questionIndex = 0;

  gameEnded = false;

  currentQuestions =
    shuffle(
      [...part1Questions]
    );

  updateUI();

  startAudio();

  showQuestion();

}


/* =====================================================
   UPDATE UI
===================================================== */

function updateUI(){

  document.getElementById("lives")
    .textContent = lives;

  document.getElementById("score")
    .textContent = score;

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion(){

  if(gameEnded){
    return;
  }

  if(questionIndex >= currentQuestions.length){

    if(part === 1){

      part = 2;

      questionIndex = 0;

      currentQuestions =
        shuffle(
          [...part2Questions]
        );

      setPart2();

      return;

    }

    winGame();

    return;
  }


  finishedBalloons = 0;

  const q =
    currentQuestions[questionIndex];

  const partLabel =
    document.getElementById("partLabel");

  const questionSmall =
    document.getElementById("questionSmall");

  const question =
    document.getElementById("question");

  const digitalContainer =
    document.getElementById("digitalContainer");

  const digitalTime =
    document.getElementById("digitalTime");


  if(part === 1){

    partLabel.textContent =
      "PART 1";

    questionSmall.textContent =
      "Find the correct clock:";

    question.textContent =
      q.text;

    digitalContainer
      .classList
      .add("hidden");

  }else{

    partLabel.textContent =
      "PART 2";

    questionSmall.textContent =
      "Find the matching analog clock:";

    question.textContent =
      "What time is it?";

    digitalContainer
      .classList
      .remove("hidden");

    digitalTime.textContent =
      q.time;

  }

  createBalloons(q);

}


/* =====================================================
   PART 2
===================================================== */

function setPart2(){

  const partLabel =
    document.getElementById("partLabel");

  const questionSmall =
    document.getElementById("questionSmall");

  const question =

}


/* =====================================================
   CREATE BALLOONS
===================================================== */

function createBalloons(q){

  const area =
    document.getElementById("balloonArea");

  area.innerHTML = "";

  finishedBalloons = 0;


  /*
    Get wrong answers from both parts.
  */

  let allChoices = [];

  part1Questions.forEach(function(item){
    allChoices.push(item.className);
  });

  part2Questions.forEach(function(item){
    allChoices.push(item.className);
  });


  /*
    Remove duplicate choices
  */

  allChoices =
    [...new Set(allChoices)];


  /*
    Correct answer first.
  */

  let choices = [
    q.className
  ];


  /*
    Shuffle wrong answers.
  */

  let wrong =
    shuffle(
      allChoices.filter(
        function(item){
          return item !== q.className;
        }
      )
    );


  /*
    Add four wrong clocks.
  */

  for(let i=0;i<wrong.length;i++){

    if(choices.length >= 5){
      break;
    }

    choices.push(wrong[i]);

  }


  choices =
    shuffle(choices);


  /*
    Create exactly five balloons.
  */

  for(let i=0;i<5;i++){

    const balloon =
      document.createElement("div");

    balloon.className =
      "balloon";

    balloon.style.animationDelay =
      (i * 0.7) + "s";


    const clock =
      document.createElement("div");

    clock.className =
      "clock " + choices[i];


    clock.innerHTML = `
      <span class="number n12">12</span>
      <span class="number n3">3</span>
      <span class="number n6">6</span>
      <span class="number n9">9</span>

      <div class="hour"></div>
      <div class="minute"></div>
      <div class="center"></div>
    `;


    balloon.appendChild(clock);


    if(choices[i] === q.className){

      balloon.dataset.answer =
        "correct";

    }else{

      balloon.dataset.answer =
        "wrong";

    }


    balloon.addEventListener(
      "click",
      function(){

        balloonClicked(balloon);

      }
    );


    balloon.addEventListener(
      "animationend",
      function(){

        balloonFinished(balloon);

      }
    );


    area.appendChild(balloon);

  }

}


/* =====================================================
   BALLOON FINISHED
===================================================== */

function balloonFinished(balloon){

  if(balloon.dataset.finished === "yes"){
    return;
  }

  balloon.dataset.finished =
    "yes";

  finishedBalloons++;


  if(finishedBalloons >= 5){

    if(gameEnded){
      return;
    }


    /*
      No answer was selected.
      Lose ONE life.
    */

    lives--;

    wrongSound();

    updateUI();


    if(lives <= 0){

      loseGame();

      return;

    }


    /*
      Move to next question.
    */

    setTimeout(function(){

      if(!gameEnded){

        questionIndex++;

        showQuestion();

      }

    },500);

  }

}


/* =====================================================
   BALLOON CLICK
===================================================== */

function balloonClicked(balloon){

  if(gameEnded){
    return;
  }

  if(balloon.dataset.clicked === "yes"){
    return;
  }

  balloon.dataset.clicked =
    "yes";


  if(balloon.dataset.answer === "correct"){

    correctSound();

    score += 10;

    updateUI();

    balloon.style.transform =
      "scale(1.4)";

    balloon.style.opacity =
      "0";


    setTimeout(function(){

      questionIndex++;

      showQuestion();

    },450);


  }else{

    /*
      Wrong answer = lose one life.
    */

    lives--;

    wrongSound();

    updateUI();

    balloon.style.transform =
      "scale(.7)";

    balloon.style.opacity =
      "0";


    setTimeout(function(){

      balloon.remove();

    },200);


    if(lives <= 0){

      loseGame();

    }

  }

}


/* =====================================================
   WIN
===================================================== */

function winGame(){

  gameEnded = true;

  if(musicInterval){
    clearInterval(musicInterval);
  }

  winSound();


  document
    .getElementById("messageTitle")
    .textContent =
    "🎉 Excellent, " +
    playerName +
    "!";


  document
    .getElementById("messageText")
    .innerHTML =
    `
    You completed the game!<br><br>
    ⭐ Score: ${score}<br>
    ❤️ Lives left: ${lives}<br><br>
    Great job!
    `;


  document
    .getElementById("message")
    .classList
    .remove("hidden");

}


/* =====================================================
   GAME OVER
===================================================== */

function loseGame(){

  gameEnded = true;

  if(musicInterval){
    clearInterval(musicInterval);
  }

  loseSound();


  document
    .getElementById("messageTitle")
    .textContent =
    "💔 GAME OVER";


  document
    .getElementById("messageText")
    .innerHTML =
    `
    Good try, ${playerName}!<br><br>
    ⭐ Score: ${score}<br><br>
    Keep practicing!
    `;


  document
    .getElementById("message")
    .classList
    .remove("hidden");

}


/* =====================================================
   RESTART
===================================================== */

function restartGame(){

  document
    .getElementById("message")
    .classList
    .add("hidden");

  lives = 5;

  score = 0;

  part = 1;

  questionIndex = 0;

  gameEnded = false;

  currentQuestions =
    shuffle(
      [...part1Questions]
    );

  updateUI();

  showQuestion();

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    const temp =
      array[i];

    array[i] =
      array[j];

    array[j] =
      temp;

  }

  return array;

}


/* =====================================================
   AUDIO
===================================================== */

function startAudio(){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if(audioContext.state === "suspended"){

      audioContext.resume();

    }


    startMusic();

  }catch(error){

    console.log(
      "Audio is not available."
    );

  }

}


function tone(
  frequency,
  duration,
  type,
  volume
){

  if(!audioContext){
    return;
  }

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();


  oscillator.type =
    type || "sine";

  oscillator.frequency.value =
    frequency;


  gain.gain.setValueAtTime(
    volume || .05,
    audioContext.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime +
    duration
  );


  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );


  oscillator.start();

  oscillator.stop(
    audioContext.currentTime +
    duration
  );

}

  const melody = [
